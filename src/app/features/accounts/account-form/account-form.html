<header class="page-header">
  <h2>{{ isEditMode ? 'Editar conta' : 'Nova conta' }}</h2>
  <a mat-button routerLink="/accounts">Voltar</a>
</header>

<mat-card>
  <mat-card-content>
    <form class="account-form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Instituição</mat-label>
        <input matInput formControlName="institution" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="type">
          @for (option of typeOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Saldo inicial (R$)</mat-label>
        <input matInput type="number" step="0.01" formControlName="initialBalance" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data do saldo inicial</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="initialBalanceDate" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ícone (opcional)</mat-label>
        <input matInput formControlName="icon" placeholder="ex.: wallet" />
      </mat-form-field>

      <label class="color-field">
        Cor (opcional)
        <input type="color" formControlName="color" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Salvando...' : 'Salvar' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
