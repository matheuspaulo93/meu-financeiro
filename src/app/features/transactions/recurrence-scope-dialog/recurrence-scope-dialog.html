<h2 mat-dialog-title>Transação recorrente</h2>

<mat-dialog-content>
  <p>
    {{
      data.action === 'edit'
        ? 'Esta transação faz parte de uma recorrência. Aplicar a alteração:'
        : 'Esta transação faz parte de uma recorrência. Excluir:'
    }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="choose('only')">Somente esta</button>
  <button mat-flat-button color="primary" (click)="choose('future')">
    Esta e todas as futuras
  </button>
</mat-dialog-actions>
